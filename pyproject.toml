[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cu-commons"
version = "1.0.0"
description = "Small, portable clients and helpers for personal automations: Telegram, email, Postgres (Neon), MongoDB, Garmin Personal API, Strava, Open-Meteo, AWS Lambda."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pawan Kumar"}]
requires-python = ">=3.12"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
db = ["SQLAlchemy>=2.0", "pg8000>=1.31", "pymongo>=4.6", "pandas>=2.2"]
garmin = ["garmin-connect-personal-api-python>=1.0"]
aws = ["boto3>=1.34"]
all = ["cu-commons[db,garmin,aws]"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.urls]
Repository = "https://github.com/cupawan/cu-commons"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
